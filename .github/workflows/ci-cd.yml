name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  test:
    name: Automated Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy .env.example
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Test Suite (PHPUnit)
        run: php artisan test

  deploy:
    name: Deploy to Production VPS (CD)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment on VPS..."
            cd /opt/projects/graduance
            
            echo "📥 Fetching and syncing latest commits from main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Rebuilding and restarting application container..."
            docker compose up -d --build app
            
            echo "💾 Running database migrations..."
            docker exec graduance_app php artisan migrate --force
            
            echo "⚡ Caching configurations, routes, and views..."
            docker exec graduance_app php artisan optimize:clear
            docker exec graduance_app php artisan config:cache
            docker exec graduance_app php artisan route:cache
            docker exec graduance_app php artisan view:cache
            
            echo "🔗 Verifying storage symlink..."
            docker exec graduance_app php artisan storage:link || true
            
            echo "🔍 Verifying endpoint health..."
            curl -f -s -k -I https://graduance.digitalneeds.my.id || exit 1
            echo "🎉 Deployment successful and live at https://graduance.digitalneeds.my.id"
